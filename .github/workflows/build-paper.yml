name: build paper

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc weasyprint fonts-dejavu poppler-utils

      - name: Build PDF
        run: |
          bash scripts/build_paper.sh
          pdfinfo PAPER.pdf | grep -E '^(Pages|Title|Author):'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coldplate-paper
          path: PAPER.pdf
          if-no-files-found: error

      - name: Enforce four-page brief
        run: |
          pages="$(pdfinfo PAPER.pdf | awk '/^Pages:/ {print $2}')"
          test "$pages" -eq 4
