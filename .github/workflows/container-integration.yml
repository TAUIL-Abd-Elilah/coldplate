name: container integration

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
  push:
    paths:
      - "tesseracts/**"
      - "orchestrator/compare_thermal_backends.py"
      - "orchestrator/pipeline.py"
      - "scripts/judge_demo.sh"
      - "scripts/verify_integrity.sh"
      - ".github/workflows/container-integration.yml"

permissions:
  contents: read

jobs:
  end-to-end-containers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install driver
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-orchestrator.txt

      - name: Build compiler toolchain
        run: bash scripts/build_toolchain.sh

      - name: Build all Tesseracts
        run: |
          tesseract build tesseracts/stokes_brinkman
          tesseract build tesseracts/thermal_advdiff
          tesseract build tesseracts/thermal_fortran
          tesseract build tesseracts/material_map

      - name: Exercise the real container boundary
        run: bash scripts/judge_demo.sh --no-build --grid 8
