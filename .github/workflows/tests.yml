name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      # Eigen builds the C++ fixture. ffprobe verifies the actual committed
      # release-video streams rather than trusting its extension or manifest.
      - name: Install Eigen and ffprobe
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libeigen3-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-orchestrator.txt
          pip install torch==2.13.0+cpu --index-url https://download.pytorch.org/whl/cpu

      # No Docker here on purpose: the Tesseract API endpoints are ordinary
      # Python functions, so the whole numerical surface -- solvers, sparse
      # assembly, JVPs, VJPs, adjoint identities -- is testable without
      # building or serving containers. Container-level composition is covered
      # by orchestrator/compare_to_reference.py, which does need Docker.
      - name: Run tests
        run: python -m pytest tests -q

      # Prose drifts from data silently. These re-derive the audited headline
      # numbers from stored results, so a stale claim fails the build rather
      # than sitting there looking plausible.
      - name: Audit headline numbers against measurements
        run: python scripts/audit_claims.py

      - name: Check submission completeness
        # Private-safe during development; automatically strict after the
        # repository is made public on 29 August.
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$REPOSITORY_PRIVATE" = "false" ]; then
            python scripts/check_submission.py --strict-public
          else
            python scripts/check_submission.py
          fi
