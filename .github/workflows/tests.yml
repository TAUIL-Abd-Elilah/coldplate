name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Eigen is needed to build the C++ Tesseract's shared library; the test
      # fixture compiles it on the fly if it is not already present.
      - name: Install Eigen
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libeigen3-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-orchestrator.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      # No Docker here on purpose: the Tesseract API endpoints are ordinary
      # Python functions, so the whole numerical surface -- solvers, sparse
      # assembly, JVPs, VJPs, adjoint identities -- is testable without
      # building or serving containers. Container-level composition is covered
      # by orchestrator/compare_to_reference.py, which does need Docker.
      - name: Run tests
        run: python -m pytest tests -q

      # Prose drifts from data silently. These re-derive every quoted number
      # from the stored results and verify the repository delivers what the
      # README says it does, so a stale claim fails the build rather than
      # sitting there looking plausible.
      - name: Audit quoted numbers against measurements
        run: python scripts/audit_claims.py

      - name: Check submission completeness
        run: python scripts/check_submission.py
