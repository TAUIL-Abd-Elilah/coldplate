name: extended submission evidence

on:
  workflow_dispatch:
    inputs:
      experiment:
        description: Evidence bundle to run after building the four components
        required: true
        default: physics
        type: choice
        options:
          - physics
          - showdown
          - robustness
          - all

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Install driver
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-orchestrator.txt

      - name: Build compiler toolchain and all four Tesseracts
        run: |
          bash scripts/build_toolchain.sh
          for component in stokes_brinkman thermal_advdiff thermal_fortran material_map; do
            tesseract build "tesseracts/$component"
          done

      - name: Nonlinear benchmark and dimensional cold plate
        if: inputs.experiment == 'physics' || inputs.experiment == 'all'
        working-directory: orchestrator
        run: |
          set -euo pipefail
          python -u benchmark_de_vahl_davis.py --N 32 --Ra 1000 10000 \
            --out results/de_vahl_davis.json
          python -u dimensional_coldplate.py --N 32 --mesh-sizes 16 24 \
            --out results/dimensional_coldplate.json

      - name: Common raw-proposal strong-coupling optimisation showdown
        if: inputs.experiment == 'showdown' || inputs.experiment == 'all'
        working-directory: orchestrator
        run: |
          set -euo pipefail
          python -u strong_coupling_showdown.py \
            --out results/strong_coupling_showdown.json

      - name: Retrospectively frozen 48-attempt robustness matrix
        if: inputs.experiment == 'robustness' || inputs.experiment == 'all'
        working-directory: orchestrator
        run: |
          set -euo pipefail
          # Execute one (Ra, seed) case per subprocess. The matrix runner owns
          # the per-attempt timeout and atomically checkpoints every outcome,
          # including timeout/runner_failure, before moving to the next case.
          # A nonzero final status means the matrix itself is incomplete; the
          # always-upload step below still preserves all durable records.
          python -u intervention_robustness_matrix.py \
            --out results/intervention_robustness_matrix_48.json \
            --attempt-dir results/intervention_robustness_matrix_48_attempts

      - name: Show compact evidence summary
        if: always()
        run: |
          find orchestrator/results -maxdepth 1 -type f -name '*.json' \
            -printf '%f %s bytes\n' | sort

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: extended-evidence-${{ inputs.experiment }}-${{ github.sha }}
          path: |
            orchestrator/results/de_vahl_davis.json
            orchestrator/results/dimensional_coldplate.json
            orchestrator/results/strong_coupling_showdown.json
            orchestrator/results/intervention_robustness_Ra*.json
            orchestrator/results/intervention_robustness_matrix_48.json
            orchestrator/results/intervention_robustness_matrix_48_attempts/*.json
          if-no-files-found: warn
