name: submission release

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Prepare a draft, or verify anonymously and publish it
        required: true
        default: prepare
        type: choice
        options:
          - prepare
          - publish
      release_tag:
        description: GitHub release and OCI convenience tag
        required: true
        default: submission-2026
        type: string
      confirmation:
        description: Enter PREPARE or PUBLISH to match the selected phase
        required: true
        type: string

# Serialize the two manual phases. A publish dispatch waits for preparation;
# it can never cancel preparation halfway through an image push.
concurrency:
  group: ${{ github.repository }}-submission-release
  cancel-in-progress: false

# Every privilege is granted at job scope below.
permissions: {}

jobs:
  prepare:
    if: inputs.phase == 'prepare'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: submission-production
    permissions:
      actions: read
      contents: write
      packages: write
    steps:
      - name: Validate manual authorization, tag, and UTC publication date
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt
          import os
          import re

          if os.environ["CONFIRMATION"] != "PREPARE":
              raise SystemExit("confirmation must be exactly PREPARE")
          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,63}", tag):
              raise SystemExit("release_tag must be 1-64 safe tag characters")
          cutoff = dt.datetime(2026, 8, 29, tzinfo=dt.timezone.utc)
          if dt.datetime.now(dt.timezone.utc) < cutoff:
              raise SystemExit("submission preparation is locked until 2026-08-29 00:00 UTC")
          PY

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Require public repository and a protected production environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)" = public
          gh api "repos/$GITHUB_REPOSITORY/environments/submission-production" \
            > "$RUNNER_TEMP/submission-environment.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          state = json.loads((Path(os.environ["RUNNER_TEMP"]) / "submission-environment.json").read_text())
          if not state.get("protection_rules"):
              raise SystemExit("submission-production must have at least one protection rule")
          PY

      - name: Fail before mutation unless the release tag is unused or pinned here
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json isDraft,tagName,targetCommitish,assets \
              > "$RUNNER_TEMP/preflight-release.json" 2>/dev/null; then
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          state = json.loads((Path(os.environ["RUNNER_TEMP"]) / "preflight-release.json").read_text())
          sha, tag = os.environ["GITHUB_SHA"], os.environ["TAG"]
          allowed = {
              "PAPER.pdf", "SHA256SUMS", "coldplate_submission.mp4",
              "coldplate_submission.en.srt", "poster.png", "video_manifest.json",
              "coldplate_submission_local_voice.mp4",
              "coldplate_submission_local_voice.en.srt",
              "video_manifest_local_voice.json",
              "image-digests.txt", "release-provenance.json", f"coldplate-{sha}.tar.gz",
          }
          actual = {asset["name"] for asset in state["assets"]}
          if (state.get("isDraft"), state.get("tagName"), state.get("targetCommitish")) != (True, tag, sha):
              raise SystemExit("existing release is not an idempotent same-SHA draft; no images or assets were changed")
          if actual - allowed:
              raise SystemExit(f"existing draft has unexpected assets: {sorted(actual - allowed)}")
          PY
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
              > "$RUNNER_TEMP/preflight-tag.json" 2>/dev/null; then
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          target = json.loads((Path(os.environ["RUNNER_TEMP"]) / "preflight-tag.json").read_text())["object"]
          if (target.get("type"), target.get("sha")) != ("commit", os.environ["GITHUB_SHA"]):
              raise SystemExit("existing tag is not a lightweight tag at this exact commit; no images or assets were changed")
          PY
          fi

      - name: Install test, media, paper, and native-build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libeigen3-dev pandoc weasyprint fonts-dejavu poppler-utils
          python -m pip install --upgrade pip
          pip install -r requirements-orchestrator.txt
          pip install torch==2.13.0+cpu --index-url https://download.pytorch.org/whl/cpu

      - name: Require all evidence and media to be committed at this exact SHA
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          required=(
            PAPER.pdf
            demo/coldplate_submission.mp4
            demo/coldplate_submission.en.srt
            demo/poster.png
            demo/video_manifest.json
            demo/coldplate_submission_local_voice.mp4
            demo/coldplate_submission_local_voice.en.srt
            demo/video_manifest_local_voice.json
            orchestrator/results/EVIDENCE_PROVENANCE.json
            orchestrator/results/strong_coupling_showdown.json
            orchestrator/results/strong_coupling_showdown_interpretation.json
            orchestrator/results/intervention_robustness_matrix_48.json
            orchestrator/results/de_vahl_davis.json
            orchestrator/results/dimensional_coldplate.json
          )
          for path in "${required[@]}"; do
            git ls-files --error-unmatch "$path" >/dev/null
            test -s "$path"
          done
          test -z "$(git status --porcelain --untracked-files=no)"
          python scripts/validate_video.py \
            --video demo/coldplate_submission.mp4 \
            --manifest demo/video_manifest.json \
            --captions demo/coldplate_submission.en.srt \
            --poster demo/poster.png
          python scripts/validate_video.py \
            --video demo/coldplate_submission_local_voice.mp4 \
            --manifest demo/video_manifest_local_voice.json \
            --captions demo/coldplate_submission_local_voice.en.srt \
            --poster demo/poster.png

      - name: Verify source, measurements, eligibility, and paper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pytest tests -q
          python scripts/validate_evidence_provenance.py --verify-github
          python scripts/audit_claims.py
          python scripts/check_submission.py --strict-public
          bash scripts/build_paper.sh
          test "$(pdfinfo PAPER.pdf | awk '/^Pages:/ {print $2}')" -eq 4
          # Release assets are copied from the worktree, so any regenerated
          # tracked byte must still be exactly the byte committed at HEAD.
          git diff --exit-code HEAD --

      - name: Build compiler toolchain and all Tesseracts
        run: |
          set -euo pipefail
          bash scripts/build_toolchain.sh
          for component in stokes_brinkman thermal_advdiff thermal_fortran material_map; do
            tesseract build "tesseracts/$component"
          done
          bash scripts/judge_demo.sh --no-build --grid 8
          git diff --exit-code HEAD --

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push commit-pinned images and record OCI digests
        env:
          OWNER: ${{ github.repository_owner }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          mkdir -p release-dist
          : > release-dist/image-digests.txt
          for component in stokes_brinkman thermal_advdiff thermal_fortran material_map; do
            target="ghcr.io/$owner/coldplate-$component"
            docker tag "$component:latest" "$target:$GITHUB_SHA"
            docker tag "$component:latest" "$target:$RELEASE_TAG"
            push_output="$(docker push "$target:$GITHUB_SHA")"
            docker push "$target:$RELEASE_TAG"
            digest="$(printf '%s\n' "$push_output" | awk '/digest:/ {print $2}' | tail -1)"
            test -n "$digest"
            printf '%s=%s@%s\n' "$component" "$target" "$digest" \
              | tee -a release-dist/image-digests.txt
          done
          python scripts/validate_image_manifest.py release-dist/image-digests.txt

      - name: Assemble deterministic release assets and provenance
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          prefix="coldplate-$GITHUB_SHA/"
          git archive --format=tar --prefix="$prefix" "$GITHUB_SHA" \
            | gzip -n > "release-dist/coldplate-$GITHUB_SHA.tar.gz"
          cp PAPER.pdf release-dist/
          cp demo/coldplate_submission.mp4 release-dist/
          cp demo/coldplate_submission.en.srt release-dist/
          cp demo/poster.png release-dist/
          cp demo/video_manifest.json release-dist/
          cp demo/coldplate_submission_local_voice.mp4 release-dist/
          cp demo/coldplate_submission_local_voice.en.srt release-dist/
          cp demo/video_manifest_local_voice.json release-dist/
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          sha = os.environ["GITHUB_SHA"]
          provenance = {
              "schema": "coldplate-release-provenance-v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "prepared_sha": sha,
              "release_tag": os.environ["RELEASE_TAG"],
              "release_state": "draft",
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "source_archive": f"coldplate-{sha}.tar.gz",
          }
          Path("release-dist/release-provenance.json").write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
          (
            cd release-dist
            sha256sum \
              PAPER.pdf \
              coldplate_submission.mp4 \
              coldplate_submission.en.srt \
              poster.png \
              video_manifest.json \
              coldplate_submission_local_voice.mp4 \
              coldplate_submission_local_voice.en.srt \
              video_manifest_local_voice.json \
              image-digests.txt \
              release-provenance.json \
              "coldplate-$GITHUB_SHA.tar.gz" \
              > SHA256SUMS
          )

      - name: Create or refresh only a draft release at the prepared SHA
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json isDraft,tagName,targetCommitish,assets \
              > "$RUNNER_TEMP/existing-release.json" 2>/dev/null; then
            # Fail before mutating anything unless this is an idempotent
            # refresh of the same draft and full commit SHA. Missing expected
            # assets are repairable; unexpected stale assets are not ignored.
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          state = json.loads((Path(os.environ["RUNNER_TEMP"]) / "existing-release.json").read_text())
          sha, tag = os.environ["GITHUB_SHA"], os.environ["TAG"]
          allowed = {
              "PAPER.pdf", "SHA256SUMS", "coldplate_submission.mp4",
              "coldplate_submission.en.srt", "poster.png", "video_manifest.json",
              "coldplate_submission_local_voice.mp4",
              "coldplate_submission_local_voice.en.srt",
              "video_manifest_local_voice.json",
              "image-digests.txt", "release-provenance.json", f"coldplate-{sha}.tar.gz",
          }
          actual = {asset["name"] for asset in state["assets"]}
          if (state.get("isDraft"), state.get("tagName"), state.get("targetCommitish")) != (True, tag, sha):
              raise SystemExit("existing release is not an idempotent same-SHA draft; left untouched")
          unexpected = actual - allowed
          if unexpected:
              raise SystemExit(f"existing draft has unexpected assets; left untouched: {sorted(unexpected)}")
          PY
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
                > "$RUNNER_TEMP/existing-tag.json" 2>/dev/null; then
              python - <<'PY'
          import json
          import os
          from pathlib import Path

          tag = json.loads((Path(os.environ["RUNNER_TEMP"]) / "existing-tag.json").read_text())["object"]
          if (tag.get("type"), tag.get("sha")) != ("commit", os.environ["GITHUB_SHA"]):
              raise SystemExit("existing tag is not a lightweight tag at the prepared SHA; left untouched")
          PY
            fi
            gh release edit "$TAG" --draft \
              --title "Coldplate -- Tesseract Hackathon 2026" \
              --notes-file release/RELEASE_NOTES.md
            gh release upload "$TAG" release-dist/* --clobber
          else
            gh release create "$TAG" release-dist/* --draft --target "$GITHUB_SHA" \
              --title "Coldplate -- Tesseract Hackathon 2026" \
              --notes-file release/RELEASE_NOTES.md
          fi
          gh release view "$TAG" \
            --json isDraft,tagName,targetCommitish,assets \
            > "$RUNNER_TEMP/prepared-release.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          state = json.loads((Path(os.environ["RUNNER_TEMP"]) / "prepared-release.json").read_text())
          sha, tag = os.environ["GITHUB_SHA"], os.environ["TAG"]
          expected = {
              "PAPER.pdf", "SHA256SUMS", "coldplate_submission.mp4",
              "coldplate_submission.en.srt", "poster.png", "video_manifest.json",
              "coldplate_submission_local_voice.mp4",
              "coldplate_submission_local_voice.en.srt",
              "video_manifest_local_voice.json",
              "image-digests.txt", "release-provenance.json", f"coldplate-{sha}.tar.gz",
          }
          actual = {asset["name"] for asset in state["assets"]}
          if state["isDraft"] is not True or state["tagName"] != tag:
              raise SystemExit("release must still be the requested draft")
          if state["targetCommitish"] != sha:
              raise SystemExit("draft target is not the prepared SHA")
          if actual != expected:
              raise SystemExit(f"draft asset set mismatch; expected {sorted(expected)}, found {sorted(actual)}")
          PY

      - name: Next required manual action
        run: |
          echo '### Draft ready -- do not publish yet' >> "$GITHUB_STEP_SUMMARY"
          echo 'Set all four GHCR packages to Public, then rerun this workflow with phase `publish`.' >> "$GITHUB_STEP_SUMMARY"

  publish:
    if: inputs.phase == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: submission-production
    permissions:
      actions: read
      contents: write
    steps:
      - name: Validate manual authorization, tag, and UTC publication date
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt
          import os
          import re

          if os.environ["CONFIRMATION"] != "PUBLISH":
              raise SystemExit("confirmation must be exactly PUBLISH")
          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,63}", tag):
              raise SystemExit("release_tag must be 1-64 safe tag characters")
          cutoff = dt.datetime(2026, 8, 29, tzinfo=dt.timezone.utc)
          if dt.datetime.now(dt.timezone.utc) < cutoff:
              raise SystemExit("submission publication is locked until 2026-08-29 00:00 UTC")
          PY

      - name: Resolve the prepared SHA from the checksummed draft
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          VERIFY_DIR: ${{ runner.temp }}/release-verify
        run: |
          set -euo pipefail
          mkdir -p "$VERIFY_DIR"
          gh release view "$TAG" --json isDraft,tagName,targetCommitish,assets \
            > "$VERIFY_DIR/release-state.json"
          gh release download "$TAG" --dir "$VERIFY_DIR"
          (cd "$VERIFY_DIR" && sha256sum -c SHA256SUMS)
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          directory = Path(os.environ["VERIFY_DIR"])
          provenance = json.loads((directory / "release-provenance.json").read_text())
          state = json.loads((directory / "release-state.json").read_text())
          sha = provenance.get("prepared_sha", "")
          tag = os.environ["TAG"]
          repository = os.environ["GITHUB_REPOSITORY"]
          if provenance.get("schema") != "coldplate-release-provenance-v1":
              raise SystemExit("unknown release provenance schema")
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("prepared_sha must be a full lowercase commit SHA")
          if provenance.get("repository") != repository or provenance.get("release_tag") != tag:
              raise SystemExit("draft provenance does not match this repository and tag")
          if provenance.get("release_state") != "draft":
              raise SystemExit("release provenance was not prepared as a draft")
          if provenance.get("source_archive") != f"coldplate-{sha}.tar.gz":
              raise SystemExit("source archive is not pinned to prepared_sha")
          if state.get("isDraft") is not True or state.get("tagName") != tag:
              raise SystemExit("requested release is not the expected draft")
          if state.get("targetCommitish") != sha:
              raise SystemExit("draft target differs from checksummed prepared_sha")

          assets = {
              "PAPER.pdf", "SHA256SUMS", "coldplate_submission.mp4",
              "coldplate_submission.en.srt", "poster.png", "video_manifest.json",
              "coldplate_submission_local_voice.mp4",
              "coldplate_submission_local_voice.en.srt",
              "video_manifest_local_voice.json",
              "image-digests.txt", "release-provenance.json", f"coldplate-{sha}.tar.gz",
          }
          downloaded = {path.name for path in directory.iterdir() if path.is_file()}
          downloaded.remove("release-state.json")
          remote = {asset["name"] for asset in state["assets"]}
          if downloaded != assets or remote != assets:
              raise SystemExit("draft contains a missing or unexpected release asset")

          checksum_names = []
          for line in (directory / "SHA256SUMS").read_text().splitlines():
              match = re.fullmatch(r"[0-9a-f]{64}  ([A-Za-z0-9._-]+)", line)
              if not match:
                  raise SystemExit(f"invalid checksum record: {line!r}")
              checksum_names.append(match.group(1))
          if len(checksum_names) != len(set(checksum_names)):
              raise SystemExit("SHA256SUMS contains a duplicate asset record")
          if set(checksum_names) != assets - {"SHA256SUMS"}:
              raise SystemExit("SHA256SUMS does not cover every other asset exactly once")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"prepared_sha={sha}\n")
          PY

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.provenance.outputs.prepared_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Verify protected environment and exact prepared source/media
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARED_SHA: ${{ steps.provenance.outputs.prepared_sha }}
          VERIFY_DIR: ${{ runner.temp }}/release-verify
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PREPARED_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)" = public
          gh api "repos/$GITHUB_REPOSITORY/environments/submission-production" \
            > "$RUNNER_TEMP/submission-environment.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          state = json.loads((Path(os.environ["RUNNER_TEMP"]) / "submission-environment.json").read_text())
          if not state.get("protection_rules"):
              raise SystemExit("submission-production must have at least one protection rule")
          PY
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -r requirements-video.txt
          python scripts/validate_image_manifest.py "$VERIFY_DIR/image-digests.txt"
          python scripts/validate_video.py \
            --video "$VERIFY_DIR/coldplate_submission.mp4" \
            --manifest "$VERIFY_DIR/video_manifest.json" \
            --captions "$VERIFY_DIR/coldplate_submission.en.srt" \
            --poster "$VERIFY_DIR/poster.png"
          python scripts/validate_video.py \
            --video "$VERIFY_DIR/coldplate_submission_local_voice.mp4" \
            --manifest "$VERIFY_DIR/video_manifest_local_voice.json" \
            --captions "$VERIFY_DIR/coldplate_submission_local_voice.en.srt" \
            --poster "$VERIFY_DIR/poster.png"
          cmp "$VERIFY_DIR/PAPER.pdf" PAPER.pdf
          cmp "$VERIFY_DIR/coldplate_submission.mp4" demo/coldplate_submission.mp4
          cmp "$VERIFY_DIR/coldplate_submission.en.srt" demo/coldplate_submission.en.srt
          cmp "$VERIFY_DIR/poster.png" demo/poster.png
          cmp "$VERIFY_DIR/video_manifest.json" demo/video_manifest.json
          cmp "$VERIFY_DIR/coldplate_submission_local_voice.mp4" demo/coldplate_submission_local_voice.mp4
          cmp "$VERIFY_DIR/coldplate_submission_local_voice.en.srt" demo/coldplate_submission_local_voice.en.srt
          cmp "$VERIFY_DIR/video_manifest_local_voice.json" demo/video_manifest_local_voice.json
          prefix="coldplate-$PREPARED_SHA/"
          git archive --format=tar --prefix="$prefix" "$PREPARED_SHA" \
            | gzip -n > "$RUNNER_TEMP/expected-source.tar.gz"
          cmp "$VERIFY_DIR/coldplate-$PREPARED_SHA.tar.gz" "$RUNNER_TEMP/expected-source.tar.gz"

      - name: Prove digest pulls work without registry credentials
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/anonymous-docker
          VERIFY_DIR: ${{ runner.temp }}/release-verify
        run: |
          set -euo pipefail
          mkdir -p "$DOCKER_CONFIG"
          bash scripts/pull_release_images.sh "$VERIFY_DIR/image-digests.txt"

      - name: Publish only the still-pinned verified draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          PREPARED_SHA: ${{ steps.provenance.outputs.prepared_sha }}
          VERIFY_DIR: ${{ runner.temp }}/release-verify
        run: |
          set -euo pipefail
          gh release view "$TAG" --json isDraft,tagName,targetCommitish,assets \
            > "$RUNNER_TEMP/pre-publish-state.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          state = json.loads((Path(os.environ["RUNNER_TEMP"]) / "pre-publish-state.json").read_text())
          expected = (True, os.environ["TAG"], os.environ["PREPARED_SHA"])
          actual = (state.get("isDraft"), state.get("tagName"), state.get("targetCommitish"))
          if actual != expected:
              raise SystemExit(f"draft changed after verification: expected {expected}, found {actual}")
          original = json.loads((Path(os.environ["VERIFY_DIR"]) / "release-state.json").read_text())
          fingerprint = lambda release: sorted(
              (asset["id"], asset["name"], asset["size"], asset.get("digest"))
              for asset in release["assets"]
          )
          if fingerprint(state) != fingerprint(original):
              raise SystemExit("draft assets changed after checksum and anonymous-pull verification")
          PY
          gh release edit "$TAG" --target "$PREPARED_SHA" --draft=false --latest
          gh release view "$TAG" --json isDraft,tagName,targetCommitish \
            > "$RUNNER_TEMP/published-state.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          state = json.loads((Path(os.environ["RUNNER_TEMP"]) / "published-state.json").read_text())
          expected = (False, os.environ["TAG"], os.environ["PREPARED_SHA"])
          actual = (state.get("isDraft"), state.get("tagName"), state.get("targetCommitish"))
          if actual != expected:
              raise SystemExit(f"published release is not pinned: expected {expected}, found {actual}")
          PY
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.type)" = commit
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)" = "$PREPARED_SHA"

      - name: Check anonymous release and repository endpoints
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          curl --fail --silent --show-error "https://api.github.com/repos/$GITHUB_REPOSITORY" >/dev/null
          curl --fail --location --silent --show-error \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/SHA256SUMS" >/dev/null
